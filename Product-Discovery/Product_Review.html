<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Review</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#22292b;background:#fff;letter-spacing:0}header{padding:20px 28px;border-bottom:1px solid #dce3df;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0}button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid #bdc9c3;border-radius:4px;padding:9px 12px}button:hover,button[aria-pressed=true]{background:#e5f0e9}button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid #16804c;outline-offset:2px}.primary{background:#176b45;color:#fff;border-color:#176b45}.primary:hover{background:#125837}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:16px 28px;border-bottom:1px solid #dce3df}input,select,textarea{border:1px solid #bcc9c3;border-radius:4px;padding:9px;background:white;min-width:0}#search{width:260px;max-width:100%}.layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(330px,420px);min-height:70vh}main{padding:20px 28px;min-width:0}aside{padding:24px;border-left:1px solid #dce3df;background:#f6f8f7;min-width:0}.muted{color:#65716b;font-size:12px}.summary{display:flex;gap:24px;margin:0 0 20px;flex-wrap:wrap}.summary strong{font-size:20px;display:block;color:#176b45}.item{border-bottom:1px solid #e1e7e3;padding:14px 0;display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center}.item.selected{background:#eff6f1}.picture{width:72px;height:72px;object-fit:contain;background:#f0f3f1;border-radius:4px}.no-image{display:flex;align-items:center;justify-content:center;color:#78837d;font-size:11px;text-align:center;padding:8px}.item-title{border:0;padding:0;background:transparent;text-align:left;font-weight:bold;line-height:1.5;overflow-wrap:anywhere}.item p{margin:4px 0;line-height:1.5}.metrics{font-variant-numeric:tabular-nums;font-size:12px;text-align:right;line-height:1.8}.tag{color:#815a12;font-size:12px}.empty{padding:45px 0;max-width:470px;line-height:1.8}h2{font-size:18px;margin:0 0 14px;overflow-wrap:anywhere}h3{font-size:14px;margin:22px 0 12px}a{color:#176b45}.actions{display:flex;gap:8px;flex-wrap:wrap}.detail-image{width:100%;height:200px;object-fit:contain;background:white;margin:14px 0}dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}dt{color:#65716b}dd{margin:0;text-align:right}label{display:block;font-size:12px;color:#4a5950;margin:12px 0 5px}aside input,aside select,aside textarea{width:100%}textarea{min-height:75px;resize:vertical}.caption{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.notice{padding:10px 28px;color:#725314;background:#fff7e6;font-size:12px}#message{padding:0 28px;color:#9e352d}details{margin:12px 0}summary{cursor:pointer}footer{padding:16px 28px;color:#65716b;border-top:1px solid #dce3df;font-size:12px}.account{padding:18px 0;border-bottom:1px solid #dce3df}.account p{line-height:1.7}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #dce3df}header,nav,main,aside{padding:16px}.item{grid-template-columns:60px 1fr}.picture{width:60px;height:60px}.metrics{grid-column:2;text-align:left}#search{width:100%}}
</style></head><body>
<header><h1>Product Review</h1><div class="actions"><button id="import">Import evidence</button><button id="csv">Export sheet</button><button class="primary" id="share">Export review</button><input id="file" type="file" accept=".json" hidden></div></header>
<nav><button id="ideas" aria-pressed="true">Ideas</button><button id="accounts" aria-pressed="false">Account systems</button><input id="search" type="search" placeholder="Search product or account" aria-label="Search product or account"><select id="platform" aria-label="Platform"><option>All platforms</option><option>Instagram</option><option>TikTok</option></select><select id="window" aria-label="Post age"><option value="24">Last 24 hours</option><option value="72">Last 3 days</option><option value="168">Last 7 days</option><option value="all">All evidence</option></select><select id="decision" aria-label="Decision"><option>All decisions</option><option>Review</option><option>Save</option><option>Test</option><option>Pass</option></select><label style="margin:0"><input id="seller" type="checkbox"> Product sellers only</label></nav>
<div class="notice" id="notice">No same-day winners verified yet. Imported evidence is a snapshot; missing dates stay out of the recent view.</div><p id="message" role="status"></p>
<div class="layout"><main><div class="summary" id="counts"></div><div id="list"></div></main><aside id="detail"></aside></div>
<footer id="freshness"></footer>
<script id="evidence" type="application/json">{"posts":[{"views":null,"likes":883,"comments":4,"shares":null,"url":"https://www.instagram.com/p/DeUCR_bDcNO/","posted_at":null,"platform":"Instagram","account":"Unverified","account_type":"Unverified","product":"Loungefly stained-glass ear headbands","caption":"Amazon Exclusive Stained Glass Ear Headbands by Loungefly. At just $29 each. Cinderella or Rapunzel?","transcript":"","format":"Not reviewed","hook":"Not reviewed","offer":"","image_url":"https://i0.wp.com/chipandco.com/wp-content/uploads/2026/10/IMG_9001.jpeg?quality=65&resize=696%2C572&ssl=1","captured_at":"","decision":"Review","notes":"Product photo matched to named headbands. Branded reference only; seller, post date and paid potential are unverified.","sampling":"hashtag_top","audience":"","seller_url":"","buyer_questions":"","awareness":"Unreviewed","sophistication":"Unreviewed","strategy_evidence":"","giveaway":false,"keyword_cta":false,"offer_signal":true,"funnel":"Purchase-focused caption (inferred)","published_time_verified":false,"image_source":"https://chipandco.com/amazon-exclusive-disney-princess-ear-headbands-655278/"},{"views":null,"likes":437,"comments":968,"shares":null,"url":"https://www.instagram.com/p/DeX7r9HFThZ/","posted_at":null,"platform":"Instagram","account":"Unverified","account_type":"Unverified","product":"Fall fashion roundup","caption":"Comment CHAT and I will send you links to everything! Amazon fall fashion finds: watches, shoes, pants, jackets.","transcript":"","format":"Not reviewed","hook":"Not reviewed","offer":"","image_url":"","captured_at":"","decision":"Review","notes":"Multiple products. Link-request CTA can inflate comments. Not a verified product seller.","sampling":"hashtag_top","audience":"","seller_url":"","buyer_questions":"","awareness":"Unreviewed","sophistication":"Unreviewed","strategy_evidence":"","giveaway":false,"keyword_cta":true,"offer_signal":false,"funnel":"Purchase-focused caption (inferred)","published_time_verified":false},{"views":null,"likes":587,"comments":1015,"shares":null,"url":"https://www.instagram.com/p/Dd8-RScFh4g/","posted_at":null,"platform":"Instagram","account":"Unverified","account_type":"Unverified","product":"Home deals roundup","caption":"Do not wait for Prime Day. My home deals have started. Type SHOP PLEASE and I will send all details. Home items marked down.","transcript":"","format":"Not reviewed","hook":"Not reviewed","offer":"","image_url":"","captured_at":"","decision":"Review","notes":"Offer-based caption; individual product, account and post age unverified.","sampling":"hashtag_top","audience":"","seller_url":"","buyer_questions":"","awareness":"Unreviewed","sophistication":"Unreviewed","strategy_evidence":"","giveaway":false,"keyword_cta":true,"offer_signal":true,"funnel":"Purchase-focused caption (inferred)","published_time_verified":false},{"views":null,"likes":554,"comments":2044,"shares":null,"url":"https://www.instagram.com/p/DeM4Qowmoj1/","posted_at":null,"platform":"Instagram","account":"Unverified","account_type":"Unverified","product":"Prime Day fashion roundup","caption":"Prime Day deals I already own, wear or use. LIKE and COMMENT PRIME and I will send to you. Jeans, pants, sneakers, cardigan, matching set.","transcript":"","format":"Not reviewed","hook":"Not reviewed","offer":"","image_url":"","captured_at":"","decision":"Review","notes":"Caption matches an indexed Julie Franks post; ownership still requires direct verification. Multiple products, not qualified.","sampling":"hashtag_top","audience":"","seller_url":"","buyer_questions":"","awareness":"Unreviewed","sophistication":"Unreviewed","strategy_evidence":"","giveaway":false,"keyword_cta":true,"offer_signal":true,"funnel":"Purchase-focused caption (inferred)","published_time_verified":false},{"views":null,"likes":1005,"comments":5189,"shares":null,"url":"https://www.instagram.com/p/DeK2CZyAdKy/","posted_at":null,"platform":"Instagram","account":"Unverified","account_type":"Unverified","product":"Amazon gift-card giveaway","caption":"Giveaway closed. $500 Amazon gift card giveaway. Comment PRIME. To enter: like, comment, share. One winner.","transcript":"","format":"Not reviewed","hook":"Not reviewed","offer":"","image_url":"","captured_at":"","decision":"Review","notes":"Giveaway engagement. Exclude from product-demand comparison.","sampling":"hashtag_top","audience":"","seller_url":"","buyer_questions":"","awareness":"Unreviewed","sophistication":"Unreviewed","strategy_evidence":"","giveaway":true,"keyword_cta":true,"offer_signal":true,"funnel":"Purchase-focused caption (inferred)","published_time_verified":false}],"systems":[],"limitations":"Caption rules are tentative tags, not video analysis. Unknown metrics remain blank. Hashtag top posts are a selected sample, not a representative account history."}</script>
<script>
let data=JSON.parse(document.getElementById('evidence').textContent),posts=data.posts,mode='ideas',selected=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>v==null||v===''?'Unavailable':Number(v).toLocaleString();
function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return ''}}
function visible(){const hours=$('window').value,now=Date.now();return posts.filter(p=>{const age=now-Date.parse(p.posted_at),dateVerified=typeof p.posted_at==='string'&&/(Z|[+-]\d\d:?\d\d)$/.test(p.posted_at);return ($('platform').value==='All platforms'||p.platform===$('platform').value)&&($('decision').value==='All decisions'||p.decision===$('decision').value)&&(!$('seller').checked||p.account_type==='Product seller')&&(hours==='all'||dateVerified&&age>=0&&age<=Number(hours)*3600000)&&(p.product+' '+p.account+' '+p.caption).toLowerCase().includes($('search').value.toLowerCase())})}
function picture(p,large=false){const src=safeUrl(p.image_url);return src?`<img class="${large?'detail-image':'picture'}" src="${esc(src)}" alt="${esc(p.product||'Source product')}" loading="lazy" referrerpolicy="no-referrer">`:`<div class="${large?'detail-image':'picture'} no-image">Image unverified</div>`}
function render(){const rows=visible();$('ideas').setAttribute('aria-pressed',mode==='ideas');$('accounts').setAttribute('aria-pressed',mode==='accounts');$('counts').innerHTML=`<div><strong>${rows.length}</strong>Posts in view</div><div><strong>${rows.filter(p=>['Save','Test'].includes(p.decision)).length}</strong>Saved or testing</div><div><strong>${new Set(rows.filter(p=>p.account!=='Unverified').map(p=>p.platform+':'+p.account)).size}</strong>Verified account names</div>`;if(mode==='accounts'){renderAccounts(rows);return}if(!rows.some(p=>p.url===selected))selected=rows[0]?.url||null;$('list').innerHTML=rows.length?rows.map(p=>`<article class="item ${p.url===selected?'selected':''}">${picture(p)}<div><button class="item-title" data-select="${esc(p.url)}">${esc(p.product||'Product not reviewed')}</button><p class="muted">${esc(p.platform)} / ${esc(p.account)} / ${esc(p.decision||'Review')}</p><p class="tag">${p.giveaway?'Giveaway':p.keyword_cta?'Link-request comments':esc(p.account_type||'Seller unverified')}</p></div><div class="metrics">Views ${num(p.views)}<br>Likes ${num(p.likes)} / Comments ${num(p.comments)}</div></article>`).join(''):'<div class="empty"><h2>No posts meet this view</h2>Publication times and fresh performance evidence are still needed. Older research remains under <button id="all">All evidence</button>.</div>';$('list').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render()});if($('all'))$('all').onclick=()=>{$('window').value='all';render()};renderDetail();$('freshness').textContent='Published dates define freshness. Collection date: '+(data.captured_at||'Not recorded')+'. Public metrics do not establish sales or paid-ad returns.';document.querySelectorAll('img').forEach(im=>im.onerror=()=>im.replaceWith(Object.assign(document.createElement('span'),{textContent:'Image unavailable',className:'picture no-image'})))}
function renderAccounts(rows){const groups=new Map();rows.filter(p=>p.account&&p.account!=='Unverified').forEach(p=>{const key=p.platform+':'+p.account;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});$('list').innerHTML=groups.size?[...groups].map(([name,g])=>{const products=new Map();g.forEach(p=>{if(p.product)products.set(p.product,(products.get(p.product)||0)+1)});return `<section class="account"><h2>${esc(name)}</h2><p>${g.length} sampled posts. ${g.filter(p=>p.keyword_cta).length} link-request CTAs. ${g.filter(p=>p.giveaway).length} giveaways.</p><p>Repeated products: ${esc([...products].filter(([n,c])=>c>1).map(([n,c])=>n+' ('+c+' posts)').join(', ')||'Not established')}</p><p class="muted">Posting rate needs a complete dated window. Similarity, audience and sales remain unverified unless reviewed.</p></section>`}).join(''):'<div class="empty"><h2>Account systems need verified identities</h2>The hashtag sample has not yet been traced to account histories.</div>';$('detail').innerHTML='<h2>System breakdown</h2><p class="caption">Review repeated products, creative formats, hooks, offers and awareness stages across each account. A selected hashtag sample cannot establish an account\'s usual performance.</p>'}
function field(label,key,options){const p=posts.find(p=>p.url===selected);return `<label for="edit-${key}">${label}</label>`+(options?`<select data-key="${key}" id="edit-${key}">${options.map(o=>`<option ${p[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input data-key="${key}" id="edit-${key}" value="${esc(p[key])}">`)}
function renderDetail(){const p=posts.find(p=>p.url===selected);if(!p){$('detail').innerHTML='<h2>Idea details</h2><p class="muted">No idea selected</p>';return}const url=safeUrl(p.url);$('detail').innerHTML=`<h2>${esc(p.product||'Product not reviewed')}</h2><div class="actions"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open original post</a><button id="previous" title="Previous idea" aria-label="Previous idea">&#8592;</button><button id="next" title="Next idea" aria-label="Next idea">&#8594;</button></div>${picture(p,true)}<dl><dt>Published</dt><dd>${esc(p.posted_at||'Unverified')}</dd><dt>Views</dt><dd>${num(p.views)}</dd><dt>Likes</dt><dd>${num(p.likes)}</dd><dt>Comments</dt><dd>${num(p.comments)}</dd><dt>Shares</dt><dd>${num(p.shares)}</dd></dl>${field('Decision','decision',['Review','Save','Test','Pass'])}${field('Product','product')}${field('Account','account')}${field('Account type','account_type',['Unverified','Product seller','Affiliate creator','Brand','Other'])}<h3>Why save this idea?</h3><p class="muted">${esc(p.notes||'No rationale reviewed yet.')}</p><label for="notes">Review notes</label><textarea id="notes" data-key="notes">${esc(p.notes)}</textarea><details><summary>Creative and audience</summary>${field('Hook','hook')}${field('Format','format')}${field('Offer','offer')}${field('Audience','audience')}${field('Awareness stage','awareness',['Unreviewed','Unaware','Problem aware','Solution aware','Product aware','Most aware'])}${field('Market sophistication','sophistication',['Unreviewed','1 - First clear promise','2 - Stronger promise','3 - Explain the mechanism','4 - Improve the mechanism','5 - Identity and belief'])}<label for="strategy">Supporting words or timestamp</label><textarea data-key="strategy_evidence" id="strategy">${esc(p.strategy_evidence)}</textarea></details><details><summary>Source caption</summary><p class="caption">${esc(p.caption)}</p></details><details><summary>Evidence edits</summary>${field('Product image URL','image_url')}${field('Published time with timezone','posted_at')}${field('Seller URL','seller_url')}${field('Buyer questions observed','buyer_questions')}</details>`;$('detail').querySelectorAll('[data-key]').forEach(el=>el.onchange=()=>{p[el.dataset.key]=el.value;render()});const rows=visible(),index=rows.findIndex(r=>r.url===selected);$('previous').disabled=index<=0;$('next').disabled=index>=rows.length-1;$('previous').onclick=()=>{selected=rows[index-1].url;render()};$('next').onclick=()=>{selected=rows[index+1].url;render()}}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('share').onclick=()=>{const html=document.documentElement.outerHTML;const updated=html.replace(/(<script id="evidence" type="application\/json">)[\s\S]*?(<\/script>)/,(_,start,end)=>start+JSON.stringify({...data,posts}).replace(/</g,'\\u003c')+end);download('Product_Review.html','<!doctype html>\n'+updated,'text/html')};
$('csv').onclick=()=>{const cols=['product','platform','account','url','views','likes','comments','shares','posted_at','decision','notes','hook','format','offer','awareness','sophistication','strategy_evidence'];const quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('Product_Review.csv','\ufeff'+[cols,...visible().map(p=>cols.map(c=>p[c]))].map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv')};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const incoming=JSON.parse(await e.target.files[0].text()),items=Array.isArray(incoming)?incoming:incoming.posts;if(!Array.isArray(items)||!items.every(p=>p&&safeUrl(p.url)))throw Error('Import requires a posts array with HTTPS post URLs.');for(const p of items){for(const metric of ['views','likes','comments','shares']){if(p[metric]===undefined||p[metric]===''||p[metric]===null)p[metric]=null;else if(!Number.isFinite(Number(p[metric]))||Number(p[metric])<0)throw Error('Invalid '+metric+' metric.');else p[metric]=Number(p[metric]);}p.account=p.account||'Unverified';p.platform=p.platform||'Other';p.product=p.product||'';p.caption=p.caption||'';p.giveaway=/giveaway|to enter|winner will/i.test(p.caption);p.keyword_cta=/comment.{0,60}(send|link|prime|chat|shop)|type.{0,30}shop/i.test(p.caption);}const existing=new Map(posts.map(p=>[p.url,p]));items.forEach(p=>existing.set(p.url,{...p,decision:existing.get(p.url)?.decision||p.decision||'Review',notes:existing.get(p.url)?.notes||p.notes||''}));posts=[...existing.values()];data.captured_at=incoming.captured_at||data.captured_at;$('message').textContent='Imported '+items.length+' evidence posts.';render()}catch(error){$('message').textContent=error.message}finally{e.target.value=''}};
const baseRender=render;render=function(){baseRender();$('counts').innerHTML=$('counts').innerHTML.replace('Verified account names','Named accounts');const now=Date.now(),fresh=posts.filter(p=>typeof p.posted_at==='string'&&/(Z|[+-]\d\d:?\d\d)$/.test(p.posted_at)&&now-Date.parse(p.posted_at)>=0&&now-Date.parse(p.posted_at)<=86400000).length;$('notice').textContent=fresh?fresh+' posts published within 24 hours. Seller identity, repeat performance and paid potential still require review.':'No dated same-day posts in this snapshot. Older or undated records remain in All evidence.';$('csv').disabled=visible().length===0;};
['search','platform','window','decision','seller'].forEach(id=>$(id).addEventListener('input',render));$('ideas').onclick=()=>{mode='ideas';render()};$('accounts').onclick=()=>{mode='accounts';render()};render();
</script></body></html>
